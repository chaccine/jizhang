<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#FFF8EC">
  <title>每日记账 · 记录生活的每一笔</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📒</text></svg>"><link rel="stylesheet" href="./style.css">
  <script defer src="./app.js"></script>
</head>
<body>
  <main id="app">
    <section id="home" class="view" aria-labelledby="home-title">
      <header class="heading"><div><p class="muted" id="today-label"></p><h1 id="home-title">每日记账</h1></div><span class="tag">认真生活</span></header>
      <article class="hero">
        <span id="month-label">本月支出</span><strong class="hero-total" id="month-expense">¥0.00</strong>
        <div class="summary-row"><div><span>今日支出</span><strong id="today-expense">¥0.00</strong></div><div><span>今日收入</span><strong class="income" id="today-income">¥0.00</strong></div></div>
        <p class="balance">今日结余 <b id="today-balance">¥0.00</b></p>
      </article>
      <div class="section-heading"><h2>今日记录</h2><span id="today-count" class="muted"></span></div>
      <div id="today-list" class="card record-list"></div>
      <p class="local-note">小小记录，心中有数 🌱<br>数据仅保存在此浏览器，记得定期导出备份</p>
    </section>
    <section id="bills" class="view" aria-labelledby="bills-title" hidden>
      <header class="heading"><div><p class="muted">收支有迹可循</p><h1 id="bills-title">账单明细</h1></div><span class="tag">生活账单</span></header>
      <div class="toolbar"><label class="pill month-pill"><span class="sr-only">筛选月份</span><input id="filter-month" type="month"></label><button id="export-csv">↓ 导出 CSV</button><button id="import-trigger">↑ 导入 CSV</button><input id="import-file" type="file" accept=".csv,text/csv" hidden></div>
      <label class="search"><span aria-hidden="true">🔍</span><input id="search" type="search" placeholder="搜索备注或分类…" aria-label="搜索备注或分类"></label>
      <div class="toolbar date-filter"><label>按日期 <input id="filter-date" type="date"></label><button id="reset-filters">重置筛选</button></div>
      <p id="filter-summary" class="muted filter-summary" aria-live="polite"></p>
      <div id="bill-list"></div>
    </section>
    <section id="stats" class="view" aria-labelledby="stats-title" hidden>
      <header class="heading"><div><p class="muted">给生活多一点从容</p><h1 id="stats-title">统计</h1></div><label class="pill month-pill"><span class="sr-only">统计月份</span><input id="stats-month" type="month" required></label></header>
      <section class="card"><h2>本月预算</h2><p id="budget-description" class="muted"></p><form id="budget-form" class="budget-form"><label class="sr-only" for="budget">月预算（元）</label><input id="budget" inputmode="decimal" placeholder="设置月预算（元）" required><button class="primary" type="submit">保存</button></form><div id="budget-progress" class="progress" role="progressbar" aria-label="预算使用比例" aria-valuemin="0" aria-valuemax="100"><span id="budget-bar"></span></div><p id="budget-status" class="muted" aria-live="polite"></p></section>
      <section class="card"><h2>分类占比</h2><p id="month-total" class="muted"></p><div class="donut-layout"><div id="category-chart"></div><div id="category-legend"></div></div><p id="category-empty" class="empty">还没有支出，记下第一笔后再来看看吧 🌱</p></section>
      <section class="card"><h2>近 7 天支出</h2><p class="muted">截至今天 · 不受上方月份筛选影响</p><div id="trend-chart"></div><p id="trend-empty" class="empty" hidden>这 7 天没有支出，生活也可以很轻盈 ☁️</p></section>
    </section>
  </main>
  <button id="add-entry" class="fab" aria-label="记一笔">+</button>
  <nav class="tabs" aria-label="页面导航"><a href="#home"><span>📒</span>记账</a><a href="#bills"><span>🧾</span>明细</a><a href="#stats"><span>📊</span>统计</a></nav>
  <dialog id="entry-sheet" aria-labelledby="entry-title">
    <div class="grab" aria-hidden="true"></div><div class="heading sheet-heading"><h2 id="entry-title">记一笔</h2><button id="close-sheet" type="button" aria-label="关闭记账">×</button></div>
    <form id="entry-form">
      <input id="entry-id" type="hidden">
      <fieldset class="type-switch"><legend class="sr-only">收支类型</legend><label><input type="radio" name="type" value="expense" checked><span>支出</span></label><label><input type="radio" name="type" value="income"><span>收入</span></label></fieldset>
      <label class="amount-input"><span>¥</span><span class="sr-only">金额（元）</span><input id="amount" type="text" inputmode="decimal" placeholder="0.00" autocomplete="off" required></label>
      <p class="amount-hint muted">记录每一份生活的小美好</p>
      <fieldset class="category-field"><legend class="sr-only">分类</legend><div id="category-chips" class="category-chips"></div><input id="category" type="hidden"></fieldset>
      <label class="field"><span>📅 日期</span><input id="date" type="date" required></label>
      <label class="field"><span>📝 备注</span><input id="note" maxlength="200" placeholder="选填，最多 200 字"></label>
      <button class="primary save" type="submit" id="save-entry">保存这一笔</button><button type="button" id="cancel-edit" class="cancel" hidden>取消编辑</button>
    </form>
  </dialog>
  <div id="toast" role="status" aria-live="polite" hidden></div>
</body>
</html>
